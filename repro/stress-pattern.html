<!doctype html>
<html><head><meta charset="utf-8"><title>eDP stress pattern</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hud{position:fixed;top:8px;left:8px;font:14px monospace;color:#0f0;background:#000a;padding:4px 8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Worst-case patterns for a display link: 1px checkerboard, 1px alternating lines,
// full black/white flashes and a moving gradient. Press 1-5 to choose, Space to cycle, H to hide the HUD.
const c=document.getElementById('c'),x=c.getContext('2d'),hud=document.getElementById('hud');
const dpr=devicePixelRatio||1; let W,H,img,mode=1,frames=0,t0=performance.now(),fps=0,auto=true,last=0;
const names={1:'1px checkerboard (inverting every frame)',2:'1px horizontal lines (inverting)',3:'1px vertical lines (inverting)',4:'full black/white flash',5:'scrolling colour gradient'};
function size(){W=c.width=Math.round(innerWidth*dpr);H=c.height=Math.round(innerHeight*dpr);img=x.createImageData(W,H)}
addEventListener('resize',size);size();
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='5'){mode=+e.key;auto=false}
 if(e.key===' '){mode=mode%5+1;auto=false} if(e.key==='h')hud.hidden=!hud.hidden; if(e.key==='a')auto=true});
function draw(n){const d=new Uint32Array(img.data.buffer),p=n&1;
 if(mode===4){x.fillStyle=p?'#fff':'#000';x.fillRect(0,0,W,H);return}
 for(let y=0;y<H;y++){const r=y*W;for(let i=0;i<W;i++){let v;
  if(mode===1)v=((i^y^p)&1); else if(mode===2)v=((y^p)&1); else if(mode===3)v=((i^p)&1);
  else{const h=(i+y+n*8)&1023;d[r+i]=0xff000000|((h*3&255)<<16)|((h*5&255)<<8)|(h*7&255);continue}
  d[r+i]=v?0xffffffff:0xff000000}}
 x.putImageData(img,0,0)}
function loop(now){draw(frames);frames++;
 if(now-t0>1000){fps=frames*1000/(now-t0);frames=0;t0=now}
 if(auto&&now-last>15000){mode=mode%5+1;last=now}
 hud.textContent=`mode ${mode}: ${names[mode]} | ${fps.toFixed(0)} fps | ${new Date().toLocaleTimeString()} | 1-5 pick, space next, a auto, h hide`;
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
